<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Desktop</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #ffffff;
      --surface-border: rgba(0, 0, 0, 0.08);
      --text-primary: #171717;
      --text-secondary: #656b74;
      --accent: #4d6bfe;
      --accent-hover: #3f5de2;
      --accent-label: #ffffff;
      --button-secondary: rgba(0, 0, 0, 0.055);
      --button-secondary-hover: rgba(0, 0, 0, 0.09);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72),
        inset 0 -1px 0 rgba(0, 0, 0, 0.035),
        inset 0 0 24px rgba(0, 0, 0, 0.018);
    }

    :root[data-theme='dark'] {
      color-scheme: dark;
      --surface: #202123;
      --surface-border: rgba(255, 255, 255, 0.09);
      --text-primary: #f2f2f2;
      --text-secondary: #a8abb2;
      --accent: #6f86ff;
      --accent-hover: #8094ff;
      --accent-label: #171717;
      --button-secondary: rgba(255, 255, 255, 0.08);
      --button-secondary-hover: rgba(255, 255, 255, 0.13);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        inset 0 0 24px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    .window {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 24px 28px 22px;
      overflow: hidden;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      -webkit-app-region: drag;
    }

    .brand {
      flex: 0 0 66px;
      padding-top: 2px;
    }

    .brand img {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .content {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }

    h1 {
      margin: 1px 0 8px;
      overflow: hidden;
      font-size: 20px;
      font-weight: 650;
      line-height: 28px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    p {
      min-height: 42px;
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 21px;
    }

    :root[data-mode='loading'] p { min-height: 21px; }

    .status {
      display: flex;
      min-height: 32px;
      margin-top: 12px;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      border: 2px solid color-mix(in srgb, var(--accent) 22%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .detail {
      max-height: 58px;
      margin: 8px 0 0;
      padding: 8px 10px;
      overflow: auto;
      color: var(--text-secondary);
      background: var(--button-secondary);
      border-radius: 9px;
      font: 12px/17px Consolas, "Cascadia Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-app-region: no-drag;
    }

    .actions {
      display: flex;
      min-height: 36px;
      margin-top: 16px;
      justify-content: flex-end;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    button {
      min-width: 80px;
      height: 36px;
      padding: 0 16px;
      color: var(--text-primary);
      background: var(--button-secondary);
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { background: var(--button-secondary-hover); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button[data-kind='primary'] {
      color: var(--accent-label);
      background: var(--accent);
    }

    button[data-kind='primary']:hover { background: var(--accent-hover); }
    [hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 1.5s; }
    }
  </style>
</head>
<body>
  <main class="window" role="status" aria-live="polite">
    <div class="brand"><img src="../../assets/icon.png" alt=""></div>
    <section class="content">
      <h1 id="title">DSH Desktop</h1>
      <p id="message"></p>
      <div id="status" class="status">
        <span class="spinner" aria-hidden="true"></span>
        <span id="stage"></span>
      </div>
      <pre id="detail" class="detail" hidden></pre>
      <div id="actions" class="actions" hidden></div>
    </section>
  </main>
</body>
</html>
