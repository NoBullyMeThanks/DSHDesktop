<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Desktop</title>
  <style>
    :root {
      color-scheme: light;
      --surface: #ffffff;
      --surface-border: rgba(0, 0, 0, 0.08);
      --text-primary: #171717;
      --text-secondary: #656b74;
      --accent: #4d6bfe;
      --accent-hover: #3f5de2;
      --accent-label: #ffffff;
      --button-secondary: rgba(0, 0, 0, 0.055);
      --button-secondary-hover: rgba(0, 0, 0, 0.09);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72),
        inset 0 -1px 0 rgba(0, 0, 0, 0.035),
        inset 0 0 24px rgba(0, 0, 0, 0.018);
    }

    :root[data-theme='dark'] {
      color-scheme: dark;
      --surface: #202123;
      --surface-border: rgba(255, 255, 255, 0.09);
      --text-primary: #f2f2f2;
      --text-secondary: #a8abb2;
      --accent: #6f86ff;
      --accent-hover: #8094ff;
      --accent-label: #171717;
      --button-secondary: rgba(255, 255, 255, 0.08);
      --button-secondary-hover: rgba(255, 255, 255, 0.13);
      --shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        inset 0 0 24px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    .window {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 24px 28px 22px;
      overflow: hidden;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      -webkit-app-region: drag;
    }

    .brand {
      flex: 0 0 66px;
      padding-top: 2px;
    }

    .brand img {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .content {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
    }

    h1 {
      margin: 1px 0 8px;
      overflow: hidden;
      font-size: 20px;
      font-weight: 650;
      line-height: 28px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    p {
      min-height: 42px;
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 21px;
    }

    :root[data-mode='loading'] p { min-height: 21px; }

    .status {
      display: flex;
      min-height: 32px;
      margin-top: 12px;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .stage {
      overflow: hidden;
      line-height: 18px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress {
      display: flex;
      /* 锁定行高：不定量阶段百分比文字为空，若由内容决定高度，
         这一行会从 16px 塌到 6px，居中后轨道比定量阶段高 5px。 */
      min-height: 16px;
      align-items: center;
      gap: 10px;
    }

    .progress-track {
      position: relative;
      flex: 1;
      min-width: 0;
      height: 6px;
      overflow: hidden;
      background: color-mix(in srgb, var(--accent) 16%, transparent);
      border-radius: 999px;
    }

    .progress-fill {
      position: absolute;
      inset: 0;
      background: var(--accent);
      border-radius: inherit;
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.24s ease-out;
      will-change: transform;
    }

    /* 无法测量总量的阶段（下载/服务启动）：不显示编造的百分比，
       改用不定量滑块表示「正在进行」，真实事实由下方事件文本给出。 */
    .progress-indeterminate {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
    }

    .progress[data-measurable='false'] .progress-fill { display: none; }
    .progress[data-measurable='false'] .progress-indeterminate { display: block; }

    .progress-indeterminate::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 34%;
      background: var(--accent);
      border-radius: inherit;
      animation: slide 1.4s ease-in-out infinite;
    }

    .progress-value {
      flex: 0 0 auto;
      min-width: 34px;
      /* 显式行高：不定量阶段这里没有文字，若不锁定行高会塌陷，
         使 .progress 行从 16px 缩到 6px，轨道整体上移 5px。 */
      line-height: 16px;
      color: var(--text-secondary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    /* 真实事件文本（如 npm 实际获取的包数），没有事件时整行不占位 */
    .metrics {
      color: var(--text-secondary);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      line-height: 16px;
    }

    .detail {
      max-height: 58px;
      margin: 8px 0 0;
      padding: 8px 10px;
      overflow: auto;
      color: var(--text-secondary);
      background: var(--button-secondary);
      border-radius: 9px;
      font: 12px/17px Consolas, "Cascadia Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      -webkit-app-region: no-drag;
    }

    .actions {
      display: flex;
      min-height: 36px;
      margin-top: 16px;
      justify-content: flex-end;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    button {
      min-width: 80px;
      height: 36px;
      padding: 0 16px;
      color: var(--text-primary);
      background: var(--button-secondary);
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover { background: var(--button-secondary-hover); }

    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    button[data-kind='primary'] {
      color: var(--accent-label);
      background: var(--accent);
    }

    button[data-kind='primary']:hover { background: var(--accent-hover); }
    [hidden] { display: none !important; }
    @keyframes slide {
      from { transform: translateX(-110%); }
      to { transform: translateX(320%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill { transition: none; }
      .progress-indeterminate::after { animation-duration: 2.6s; }
    }
  </style>
</head>
<body>
  <main class="window" role="status" aria-live="polite">
    <div class="brand"><img src="../../assets/icon.png" alt=""></div>
    <section class="content">
      <h1 id="title">DSH Desktop</h1>
      <p id="message"></p>
      <div id="status" class="status">
        <span id="stage" class="stage"></span>
        <div id="progress" class="progress" data-measurable="true">
          <div
            id="progress-track"
            class="progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progress-fill" class="progress-fill"></div>
            <div class="progress-indeterminate"></div>
          </div>
          <span id="progress-value" class="progress-value" aria-hidden="true"></span>
        </div>
        <span id="metrics" class="metrics" hidden></span>
      </div>
      <pre id="detail" class="detail" hidden></pre>
      <div id="actions" class="actions" hidden></div>
    </section>
  </main>
</body>
</html>
