<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>终端</title>
<link rel="stylesheet" href="terminal-assets/xterm.css">
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f6f7;
    --fg: #1f2328;
    --fg-secondary: #626873;
    --border: rgba(0, 0, 0, 0.08);
    --accent: #4d6bfe;
    --term-bg: #ffffff;
    /* 拖动条悬停色：不用主题蓝，用户要求偏深的灰色 */
    --drag-hover: rgba(0, 0, 0, 0.28);
  }
  [data-theme="dark"] {
    --bg: #151517;
    --bg-secondary: #1e1e21;
    --fg: #e6e6e6;
    --fg-secondary: #9ba1aa;
    --border: rgba(255, 255, 255, 0.1);
    --accent: #4d6bfe;
    --term-bg: #151517;
    --drag-hover: rgba(255, 255, 255, 0.28);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    user-select: none;
    /* 页面整体不滚动：滚动只发生在各分区内部（xterm 舞台/管理区），
       避免出现「一条滚动条控制整个终端区域向下滚动」的观感 */
    overflow: hidden;
  }
  /* 右侧停靠：面板左边界线（与 DSH 内容区区分开；底部停靠顶边由 .header 提供） */
  body[data-dock="right"] { border-left: 1px solid var(--border); }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 10px 0 14px;
    flex: 0 0 auto;
    /* 顶边线：右侧停靠时与 DSH 会话区标题区域的底边线重合（面板顶 = headerBottom - 1，
       两条 1px 线完全重叠才是一条线，见 terminal-utils RIGHT_DOCK_TOP_OFFSET） */
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  #resizeH {
    height: 6px;
    flex: 0 0 auto;
    cursor: row-resize;
    background: transparent;
  }
  #resizeH:hover { background: var(--drag-hover); }
  body[data-dock="right"] #resizeH { display: none; }
  #resizeV {
    width: 6px;
    flex: 0 0 auto;
    cursor: col-resize;
    background: transparent;
  }
  #resizeV:hover { background: var(--drag-hover); }
  body:not([data-dock="right"]) #resizeV { display: none; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--fg-secondary);
    flex: 0 0 auto;
  }
  .dot[data-mode="ready"] { background: #2fae5f; }
  .dot[data-mode="busy"] { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .dot[data-mode="error"] { background: #d64545; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  .title { font-size: 12px; color: var(--fg-secondary); }
  .spacer { flex: 1; }
  button {
    height: 24px;
    min-width: 48px;
    padding: 0 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--fg-secondary);
    font-size: 12px;
    cursor: pointer;
  }
  button:hover { background: var(--bg-secondary); }
  button:disabled { opacity: 0.4; cursor: default; }
  .dock-btn { min-width: 24px; padding: 0 5px; display: grid; place-items: center; }
  .dock-btn.active { color: var(--accent); }
  .dock-btn svg, #newBtn svg {
    width: 11px;
    height: 11px;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 1;
    stroke-linejoin: round;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
  }
  #newBtn { min-width: 24px; padding: 0 5px; display: grid; place-items: center; }
  #closeBtn { min-width: 24px; font-size: 12px; }

  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }
  #split {
    width: 6px;
    flex: 0 0 auto;
    cursor: col-resize;
    background: transparent;
  }
  #split:hover { background: var(--drag-hover); }
  .stage {
    flex: 1;
    min-width: 0;
    position: relative;
    /* 与 xterm 主题背景同色（terminal.js 按主题同步 --term-bg）：
       fit 取整余量与切换瞬间的裁切区不可见，避免露出异色条/块 */
    background: var(--term-bg, #ffffff);
  }
  .term-pane {
    position: absolute;
    inset: 0;
    display: none;
    /* flex 列布局：xterm 宿主容器（.xterm-host）拿到确定高度，
       打破「裸 div 高度由 .xterm 内容撑起 → fit 读到的父高恒等于
       xterm 自身高 → rows 永远算不回真实可视行数」的循环依赖
       （实测症状：rows=24 而面板只有 11 行可视高，执行命令后新提示符
       被画在裁剪区外，表现为「执行完命令没有新的输入行」） */
    flex-direction: column;
    padding: 6px 0 0 8px;
  }
  .term-pane.active { display: flex; }
  .term-pane .xterm-host {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  .term-pane .xterm { height: 100%; }
  .term-pane .xterm .xterm-viewport {
    scrollbar-width: thin;
    /* xterm.css 缺省把 viewport 背景写成纯黑且它比屏幕层高几个像素——
       底部露出的黑色区域就是黑色横条。改为随主题背景色，与显示区域融为一体。 */
    background-color: var(--term-bg, #ffffff) !important;
  }
  .term-exitbar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 4px 12px;
    border-top: 1px solid var(--border);
    color: var(--fg-secondary);
    font-size: 11px;
  }
  .term-pane.exited .term-exitbar { display: flex; }
  .term-pane.exited .xterm { opacity: 0.6; }

  .sessions {
    width: 170px;
    flex: 0 0 auto;
    overflow-y: auto;
    scrollbar-width: thin;
    border-left: 1px solid var(--border);
    background: var(--bg-secondary);
    padding: 6px;
  }
  .session-item {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 28px;
    padding: 0 4px 0 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    color: var(--fg);
    white-space: nowrap;
  }
  .session-item:hover { background: var(--bg); }
  .session-item.active {
    background: var(--bg);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .session-item.exited .sname, .session-item.exited .sdot { opacity: 0.5; }
  .sdot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2fae5f;
    flex: 0 0 auto;
  }
  .sdot.exited { background: var(--fg-secondary); }
  .sname { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .sname-input {
    flex: 1;
    min-width: 0;
    height: 20px;
    padding: 0 4px;
    border: 1px solid var(--accent);
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg);
    font-size: 12px;
    outline: none;
  }
  .sclose {
    min-width: 18px;
    width: 18px;
    height: 18px;
    padding: 0;
    font-size: 12px;
    flex: 0 0 auto;
    color: var(--fg-secondary);
    display: grid;
    place-items: center;
  }
  .sclose svg {
    width: 12px;
    height: 12px;
    overflow: visible;
    /* Bootstrap 垃圾桶（bootstrap-icons bi-trash）：填充式矢量，不描边，
       比 1px 描边图标更清晰；尺寸从 10px 放大到 12px */
    fill: currentColor;
    stroke: none;
  }
  .sclose:hover { color: #d64545; }
  .sessions-empty {
    padding: 10px 8px;
    font-size: 11px;
    color: var(--fg-secondary);
    text-align: center;
  }
  #status {
    padding: 3px 14px;
    font-size: 11px;
    color: var(--fg-secondary);
    border-top: 1px solid var(--border);
    flex: 0 0 auto;
  }
</style>
</head>
<body data-theme="light" data-dock="bottom">
  <div id="resizeH"></div>
  <div class="header">
    <span class="dot" id="dot"></span>
    <span class="title" id="title">终端</span>
    <div class="spacer"></div>
    <button id="newBtn" title="新建终端">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.5v7M2.5 6h7" /></svg>
    </button>
    <button id="dockBottomBtn" class="dock-btn" title="停靠到底部">
      <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" /><path d="M4 8h4" /></svg>
    </button>
    <button id="dockRightBtn" class="dock-btn" title="停靠到右侧">
      <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" /><path d="M8 4v4" /></svg>
    </button>
    <button id="closeBtn" title="收起面板">✕</button>
  </div>
  <div class="main">
    <div id="resizeV"></div>
    <div class="stage" id="stage"></div>
    <div id="split"></div>
    <div class="sessions" id="sessions">
      <div class="sessions-empty" id="sessionsEmpty">正在连接…</div>
    </div>
  </div>
  <div class="status" id="status">正在连接…</div>
  <script src="terminal-assets/xterm.js"></script>
  <script src="terminal-assets/addon-fit.js"></script>
  <script src="terminal-assets/addon-clipboard.js"></script>
  <script src="terminal.js"></script>
</body>
</html>
